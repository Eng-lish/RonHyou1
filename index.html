<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>英文法ドリル</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#2f4bd6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="英文法ドリル">
<meta name="robots" content="noindex">
<style>
:root{--bg:#f1f5fb;--card:#fff;--tx:#1b2333;--sub:#5b6577;--pri:#2f4bd6;--ok:#1a8f4c;--okbg:#e5f6ec;--ng:#d23c3c;--ngbg:#fdebeb;--bd:#d9e0ee;--chip:#eef2ff}
@media(prefers-color-scheme:dark){:root{--bg:#10141d;--card:#1a2030;--tx:#e8ecf5;--sub:#9aa5ba;--pri:#7c93ff;--ok:#4cc585;--okbg:#14301f;--ng:#ff7b7b;--ngbg:#3a1b1b;--bd:#2c3550;--chip:#232c47}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 -apple-system,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif}
.app{max-width:560px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 14px max(90px,env(safe-area-inset-bottom))}
h1{font-size:20px;margin:6px 0 2px}.sub{color:var(--sub);font-size:13px;margin:0 0 12px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
button{font:inherit;color:inherit;cursor:pointer}
.snd{border:1px solid var(--bd);background:var(--card);border-radius:20px;padding:6px 12px;font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
input[type=password]{width:100%;font:inherit;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:13px;background:var(--pri);color:#fff;font-weight:700;margin-top:10px}
.btn.ghost{background:var(--card);color:var(--pri);border:1px solid var(--bd)}
.err{color:var(--ng);font-size:14px;min-height:1.2em}
.unit{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd)}
.unit:last-child{border:0}.unit .nm{flex:1;font-size:14px;font-weight:600;line-height:1.35}
.unit button{border:1px solid var(--pri);background:var(--chip);color:var(--pri);border-radius:10px;padding:8px 9px;font-size:13px;font-weight:700;white-space:nowrap}
.unit button small{font-weight:400;opacity:.8}
.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--pri);width:0;transition:width .3s}
.meta{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub)}.meta #qTitle{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.meta #qNum{white-space:nowrap}.nx{border:0;background:var(--pri);color:#fff;font-weight:700;font-size:15px;border-radius:10px;padding:8px 14px;white-space:nowrap}
.q{font-size:20px;line-height:1.9;margin:8px 0}.ja{color:var(--sub);font-size:15px;margin:0 0 12px}
.blank{display:inline-block;min-width:3.2em;border-bottom:2px solid var(--pri);text-align:center;margin:0 3px;color:var(--pri);font-weight:700}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--bd);border-radius:12px;padding:14px;margin:8px 0;font-size:18px}
.opt b{color:var(--pri);margin-right:8px}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.ng{border-color:var(--ng);background:var(--ngbg)}.opt:disabled{opacity:1}
.slot{display:inline-block;min-width:3.4em;min-height:2.1em;border-bottom:2px solid var(--pri);margin:2px 3px;text-align:center;font-weight:700;vertical-align:bottom;background:transparent;border-top:0;border-left:0;border-right:0;color:var(--tx);font-size:19px;padding:0 4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.chip{border:2px solid var(--bd);background:var(--chip);border-radius:10px;padding:9px 14px;font-size:18px}
.chip.used{visibility:hidden}
.res{border-radius:12px;padding:12px 14px;margin-top:10px}.res.ok{background:var(--okbg);border:1px solid var(--ok)}.res.ng{background:var(--ngbg);border:1px solid var(--ng)}
.res h3{margin:0 0 4px;font-size:18px}.res .ans{font-size:17px;font-weight:700;margin:4px 0}.res p{margin:4px 0}
.nextbarX{position:fixed;left:0;right:0;bottom:0;padding:10px 14px max(12px,env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%)}
.nextbar .in{max-width:560px;margin:0 auto}
.big{font-size:44px;text-align:center;margin:8px 0}
.ver{text-align:center;color:var(--sub);font-size:11px;margin-top:20px}

.meta{align-items:center;gap:10px}.meta .qt{flex:1;min-width:0}
.nx{border:0;border-radius:12px;background:var(--pri);color:#fff;font-weight:700;font-size:16px;padding:10px 20px;white-space:nowrap}
.nx:disabled{background:var(--bd);color:var(--sub);cursor:default}
.app{padding-bottom:max(30px,env(safe-area-inset-bottom))}
@media(min-width:700px){
 .app{max-width:1100px;padding:max(18px,env(safe-area-inset-top)) 28px 24px}
 #units{display:grid;grid-template-columns:1fr 1fr;column-gap:28px}
 .unit .nm{font-size:16px}.unit button{font-size:15px;padding:10px 12px}
 h1{font-size:26px}.sub{font-size:15px}.snd{font-size:15px;padding:9px 16px}
 .nx{font-size:19px;padding:12px 28px}.card{padding:20px 26px}
}
#quiz{--fs:clamp(15px,min(2.8vw,3.1vh),32px)}
#quiz .meta{font-size:calc(var(--fs)*.75)}
#quiz .q{font-size:calc(var(--fs)*1.5);line-height:1.7;margin:4px 0}
#quiz .ja{font-size:calc(var(--fs)*1.05);margin:0 0 calc(var(--fs)*.5)}
#quiz .opt{font-size:calc(var(--fs)*1.25);padding:calc(var(--fs)*.55) calc(var(--fs)*.8);margin:calc(var(--fs)*.35) 0}
#quiz .chips{margin:calc(var(--fs)*.5) 0;gap:calc(var(--fs)*.4)}
#quiz .chip{font-size:calc(var(--fs)*1.25);padding:calc(var(--fs)*.5) calc(var(--fs)*.9)}
#quiz .slot{font-size:calc(var(--fs)*1.4);min-width:3.4em}
#quiz .res{padding:calc(var(--fs)*.6) calc(var(--fs)*.8);margin-top:calc(var(--fs)*.4)}
#quiz .res h3{font-size:calc(var(--fs)*1.2)}
#quiz .res .ans{font-size:calc(var(--fs)*1.3)}
#quiz .res .ans span{font-size:calc(var(--fs)*1)!important}
#quiz .res p{font-size:calc(var(--fs)*1.1);line-height:1.6}
#quiz .nx{font-size:calc(var(--fs)*1)}
</style>
</head>
<body>
<div class="app">
<section id="gate">
 <h1>英文法ドリル</h1><p class="sub">Introduction① 〜 PLUS①（自分用）</p>
 <div class="card"><form id="gateForm" autocomplete="off">
  <label for="pw" class="sub">パスワード</label>
  <input id="pw" type="password" autocomplete="current-password" autofocus>
  <label class="sub" style="display:block;margin-top:8px"><input type="checkbox" id="remember" checked> この端末で記憶する</label>
  <p class="err" id="gateErr"></p>
  <button class="btn" id="gateBtn" type="submit">ひらく</button></form></div>
</section>

<section id="menu" hidden>
 <div class="top"><div><h1>英文法ドリル</h1><p class="sub" id="menuSub"></p></div>
  <button class="snd" id="snd" aria-pressed="true">🔊 音あり</button></div>
 <div class="card" id="units"></div>
 <div class="card"><button class="btn ghost" style="margin:0" id="mixC">全範囲ミックス・2択（10問）</button>
  <button class="btn ghost" id="mixO">全範囲ミックス・並べ替え（10問）</button></div>
 <p class="ver">v5 ／ オフライン対応</p>
</section>

<section id="quiz" hidden>
 <div class="top"><button class="snd" id="back">← メニュー</button><button class="snd" id="snd2">🔊 音あり</button></div>
 <div class="meta"><span id="qTitle"></span><button id="next" class="nx" style="visibility:hidden">次へ ▶</button><span id="qNum"></span></div>
 <div class="bar"><i id="bar"></i></div>
 <div class="card">
  <div class="q" id="qText"></div><p class="ja" id="qJa"></p>
  <div id="opts"></div>
  <div id="chips" class="chips"></div>
  <div id="res" hidden></div>
 </div>
</section>

<section id="end" hidden>
 <div class="card"><div class="big" id="endEmoji"></div><h1 style="text-align:center" id="endScore"></h1><p class="sub" style="text-align:center" id="endTitle"></p>
 <button class="btn" id="retry">もう一度</button><button class="btn ghost" id="toMenu">メニューへ</button></div>
</section>
</div>

function place(c){if(cur.done)return;var k=cur.filled.indexOf(undefined);if(k<0)k=cur.filled.length;if(k>=cur.words.length)return;
 cur.filled[k]=c;c.classList.add("used");cur.slots[k].textContent=c.textContent;
 var all=true;for(var i=0;i<cur.words.length;i++)if(!cur.filled[i])all=false;if(all)checkO()}
function unplace(k){if(cur.done||!cur.filled[k])return;cur.filled[k].classList.remove("used");cur.filled[k]=undefined;cur.slots[k].innerHTML="&nbsp;"}
function finish(ok,ansHTML,point){
 cur.done=true;if(ok)cur.score++;
 if(state.sound)ok?playCorrect():playWrong();
 var r=$("res");r.hidden=false;r.className="res "+(ok?"ok":"ng");
 r.innerHTML="<h3>"+(ok?"⭕ 正解！":"❌ 不正解")+'</h3><div class="ans">'+ansHTML+"</div><p>"+esc(point)+"</p>";
 var last=cur.i==cur.q.length-1;$("next").textContent=last?"結果 ▶":"次へ ▶";$("next").style.visibility="visible";$("bar").style.width=((cur.i+1)/cur.q.length*100)+"%"}
function answerC(b,ok,opts,it){if(cur.done)return;
 var bs=$("opts").children;for(var i=0;i<bs.length;i++){bs[i].disabled=true;if(opts[i][1])bs[i].classList.add("ok")}
 if(!ok)b.classList.add("ng");
 var full=it[0].replace("____","<u>"+esc(it[2])+"</u>");
 var a=it[0].indexOf("____")<0?esc(it[2]):esc(it[0]).replace("____","<u>"+esc(it[2])+"</u>");
 finish(ok,a+"<br><span style='font-weight:400;font-size:15px'>"+esc(it[1])+"</span>",it[5])}
function checkO(){var it=cur.q[cur.i].it,ok=true;
 cur.filled.forEach(function(c,k){if(c.textContent!==cur.words[k])ok=false});
 cur.slots.forEach(function(s,k){s.style.color=cur.filled[k].textContent===cur.words[k]?"var(--ok)":"var(--ng)"});
 var sent=((it[1]?it[1]+" ":"")+it[2].join(" ")+(it[3]?(/^[.?!,]/.test(it[3])?it[3]:" "+it[3]):"")).replace(/\s+([.?!,])/g,"$1");
 finish(ok,esc(sent)+"<br><span style='font-weight:400;font-size:15px'>"+esc(it[0])+"</span>",it[4])}
$("next").onclick=function(){cur.i++;if(cur.i>=cur.q.length)end();else render()};
function end(){show("end");var n=cur.q.length,s=cur.score;$("endScore").textContent=s+" / "+n;$("endTitle").textContent=cur.title;
 $("endEmoji").textContent=s==n?"🎉":s>=n*0.7?"👍":"💪"}

if("serviceWorker" in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
</script>
